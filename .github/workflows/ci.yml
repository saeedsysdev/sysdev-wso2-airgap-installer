name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build Windows amd64
        if: runner.os == 'Windows'
        run: go build -o dist/sysdev-wso2-airgap-installer.exe ./cmd/sysdev-wso2-airgap-installer
      - name: Build Linux amd64
        if: runner.os == 'Linux'
        run: GOOS=linux GOARCH=amd64 go build -o dist/sysdev-wso2-airgap-installer ./cmd/sysdev-wso2-airgap-installer
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      - run: go test -race ./...
